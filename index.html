<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6efff"><title>Игровая полянка — Говорим Играя</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#352a50;background:#f7f1ff;--purple:#8460c1}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 4%,#eadbff 0,transparent 45%),linear-gradient(145deg,#fcfaff,#eee8ff);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}.wrap{max-width:670px;margin:auto;padding:24px 17px 40px}.brand{text-align:center;font-size:13px;font-weight:800;letter-spacing:.06em;color:#8565b1;text-transform:uppercase}.hero{text-align:center;margin:14px 0 26px}.hero .flower{font-size:47px}.hero h1{margin:4px 0;font-size:clamp(27px,7vw,38px);color:#68419e}.hero p{margin:7px auto;color:#736789;max-width:380px;line-height:1.5}.cards{display:grid;gap:14px}.card{border:1px solid #e7d9fc;border-radius:24px;background:#fff;box-shadow:0 12px 28px #543b7a12;padding:17px;display:flex;gap:16px;align-items:center;text-align:left;width:100%;cursor:pointer;color:inherit;font:inherit;transition:transform .12s}.card:active{transform:scale(.985)}.picture{background:var(--tint);width:85px;height:85px;border-radius:22px;display:grid;place-items:center;font-size:47px;flex-shrink:0}.words{flex:1;min-width:0}.words strong{display:block;font-size:19px}.words small{display:block;color:#746887;margin:5px 0 9px;line-height:1.4}.play{display:inline-block;background:#8c64c7;color:white;border-radius:30px;font-size:13px;font-weight:750;padding:8px 18px}.foot{text-align:center;color:#9186a5;font-size:13px;margin:26px 4px}.dialog{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:12px;background:#29213d99;overflow:auto}.dialog[hidden]{display:none}.panel{background:#fff;border-radius:25px;max-width:600px;width:100%;max-height:calc(100dvh - 24px);overflow:auto;box-shadow:0 22px 70px #1e14394d;padding:18px}.bar{display:flex;align-items:center;justify-content:space-between;gap:10px}.bar h2{font-size:22px;margin:5px 0}.close{border:0;background:#f1eafb;width:42px;height:42px;border-radius:50%;font-size:22px;color:#60488d;cursor:pointer}.hint{color:#6d6382;font-size:14px;line-height:1.5}.progress{background:#f0e8ff;border-radius:8px;height:8px;margin:18px 0;overflow:hidden}.fill{height:100%;background:#9875ca;transition:width .2s}.question{font-weight:800;font-size:clamp(20px,5vw,26px);margin:17px 0;text-align:center}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.option{display:flex;align-items:center;justify-content:center;overflow:hidden;background:#f9f5ff;border:2px solid #e7daf8;border-radius:18px;min-height:150px;padding:10px 4px;color:#41345d;font:inherit;cursor:pointer}.option .emoji{display:block;font-size:clamp(65px,16vw,94px);line-height:1.15;white-space:nowrap}.option .emoji.multi{font-size:clamp(36px,9vw,62px);letter-spacing:-4px;max-width:100%;text-align:center}.option.correct{border-color:#46b083;background:#e9faef}.option.wrong{border-color:#e48f9b;background:#fff1f2}.option:disabled{cursor:default}.feedback{text-align:center;font-weight:750;min-height:28px;margin:13px 0;color:#5d4890}.next,.again{display:block;width:100%;background:#8b67c6;color:white;border:0;border-radius:16px;font:inherit;font-weight:800;font-size:17px;padding:15px;cursor:pointer}.next:disabled{opacity:.48}.finish{text-align:center;padding:23px 0}.finish .cup{font-size:64px}.finish h3{font-size:26px}.finish p{color:#6e6288}@media(max-width:355px){.picture{width:66px;height:70px;font-size:37px}.words strong{font-size:16px}.option{min-height:125px}.option .emoji{font-size:clamp(54px,17vw,68px)}.option .emoji.multi{font-size:clamp(35px,11vw,40px);letter-spacing:-4px}}
</style></head><body><main class="wrap"><div class="brand">Говорим Играя</div><section class="hero"><div class="flower">🌼</div><h1>Игровая полянка</h1><p>Три бесплатные игры для развития речи. Выбирай приключение и начинай играть!</p></section><div class="cards" id="cards"></div><p class="foot">💜 Говорим Играя · Играем и развиваемся</p></main><div id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="gameTitle" hidden><div class="panel"><div class="bar"><h2 id="gameTitle"></h2><button class="close" id="close" aria-label="Закрыть игру">×</button></div><div id="game"></div></div></div><script src="https://telegram.org/js/telegram-web-app.js"></script><script>
const games = [
{id:1,title:'Кошечка Кики',category:'Звуки',age:'3-4',emoji:'🐱',color:'#fce5ef',caption:'Звук КЬ',description:'Помоги Кики найти слова с мягким звуком К.',questions:[{prompt:'Где КИТ?',options:['🐋|Кит','🐈|Кот','🏠|Дом','🦊|Лиса'],answer:0},{prompt:'Где КИВИ?',options:['🍓|Клубника','🥝|Киви','🍋|Лимон','🍐|Груша'],answer:1},{prompt:'Где КИСА?',options:['🐱|Киса','🐶|Собака','🐰|Заяц','🐻|Медведь'],answer:0}]},
{id:3,title:'Один — много',category:'Грамматика',age:'3-4',emoji:'🦊',color:'#fff0d6',caption:'Животные',description:'Находим один предмет и сразу несколько.',questions:[{prompt:'Где ОДНА лиса?',options:['🦊|Одна лиса','🦊🦊|Две лисы','🐻🐻|Два медведя','🐰🐰|Два зайца'],answer:0},{prompt:'Где МНОГО зайцев?',options:['🐰|Один заяц','🐱|Одна кошка','🐰🐰🐰|Много зайцев','🐻|Один медведь'],answer:2},{prompt:'Где МНОГО рыб?',options:['🐟|Одна рыба','🐟🐟🐟|Много рыб','🦋|Одна бабочка','🐝|Одна пчела'],answer:1}]},
{id:7,title:'Найди отличие',category:'Фонематический слух',age:'5-6',emoji:'👂',color:'#ffe8d9',caption:'Похожие слова',description:'Различаем похожие по звучанию слова.',questions:[{prompt:'Где МИШКА?',options:['🥣|Миска','🧸|Мишка','🐭|Мышка','🐈|Кошка'],answer:1},{prompt:'Где КОЗА?',options:['🐐|Коза','🐈|Кошка','🐄|Корова','🐑|Овца'],answer:0},{prompt:'Где СУП?',options:['🦷|Зуб','🥣|Суп','🍞|Хлеб','🧃|Сок'],answer:1}]}
];
const cards=document.getElementById('cards'),dialog=document.getElementById('dialog'),area=document.getElementById('game');let active=null,step=0,score=0,selected=null,previous=null;
for(const g of games){const btn=document.createElement('button');btn.className='card';btn.type='button';btn.innerHTML=`<span class="picture" style="--tint:${g.color}">${g.emoji}</span><span class="words"><strong>${g.title}</strong><small>${g.description}</small><span class="play">🎮 Играть</span></span>`;btn.addEventListener('click',()=>openGame(g));cards.append(btn)}
function openGame(g){active=g;step=0;score=0;previous=document.activeElement;document.getElementById('gameTitle').textContent=g.title;dialog.hidden=false;document.body.style.overflow='hidden';document.getElementById('close').focus();render()}
function closeGame(){dialog.hidden=true;document.body.style.overflow='';area.replaceChildren();if(previous)previous.focus()}
document.getElementById('close').addEventListener('click',closeGame);dialog.addEventListener('click',e=>{if(e.target===dialog)closeGame()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!dialog.hidden)closeGame()});
function render(){area.replaceChildren();selected=null;if(step>=active.questions.length){area.innerHTML=`<div class="finish"><div class="cup">🏆</div><h3>Молодец!</h3><p>Правильных ответов: ${score} из ${active.questions.length}</p><button class="again" id="again">🔄 Сыграть ещё раз</button></div>`;document.getElementById('again').onclick=()=>{step=0;score=0;render()};return}
const q=active.questions[step];const p=document.createElement('p');p.className='hint';p.textContent=active.caption+' · Вопрос '+(step+1)+' из '+active.questions.length;area.append(p);const progress=document.createElement('div');progress.className='progress';progress.innerHTML=`<div class="fill" style="width:${100*step/active.questions.length}%"></div>`;area.append(progress);const title=document.createElement('div');title.className='question';title.textContent=q.prompt;area.append(title);const opts=document.createElement('div');opts.className='options';const feedback=document.createElement('div');feedback.className='feedback';const next=document.createElement('button');next.className='next';next.textContent=step===active.questions.length-1?'Результат →':'Дальше →';next.disabled=true;q.options.forEach((raw,i)=>{const [emoji,...rest]=raw.split('|');const b=document.createElement('button');b.className='option';b.innerHTML=`<span class="emoji${Array.from(emoji).length>2?' multi':''}">${emoji}</span>`;b.setAttribute("aria-label",rest.join("|"));b.addEventListener('click',()=>{if(selected!==null)return;selected=i;const correct=i===q.answer;if(correct)score++;feedback.textContent=correct?'✨ Верно!':'Попробуем запомнить правильный ответ 💜';[...opts.children].forEach((el,j)=>{el.disabled=true;if(j===q.answer)el.classList.add('correct');else if(j===i)el.classList.add('wrong')});next.disabled=false});opts.append(b)});area.append(opts,feedback,next);next.onclick=()=>{step++;render()}}
// Optional Telegram theming; game also works in an ordinary browser.
if(window.Telegram?.WebApp){window.Telegram.WebApp.ready();window.Telegram.WebApp.expand()}
</script></body></html>
